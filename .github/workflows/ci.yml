name: CI Pipeline

on:
  push:
    branches:
      - feature/analysis
      - develop
  pull_request:
    types: [opened, edited, reopened, synchronize, review_requested, submitted]
    branches:
      - develop

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          SLN_PATH=$(find . -name "*.sln" | head -n 1)
          dotnet restore "$SLN_PATH"

      - name: Build
        run: |
          SLN_PATH=$(find . -name "*.sln" | head -n 1)
          dotnet build "$SLN_PATH" --no-restore --configuration Release

      - name: Run tests
        run: |
          SLN_PATH=$(find . -name "*.sln" | head -n 1)
          dotnet test "$SLN_PATH" --no-build --configuration Release --logger "trx;LogFileName=report.trx"

  analysis:
    name: Static Analysis & Metrics
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. Метрики кількості рядків (Cloc)
      - name: Count lines of code with Cloc
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc
          cloc . > cloc-report.txt
          cat cloc-report.txt

      # 2. Статичний аналіз SonarCloud
      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          SLN_PATH=$(find . -name "*.sln" | head -n 1)
          
          dotnet-sonarscanner begin /k:"Dortmo0nd_Places_Lab5" /o:"dortmo0nd" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io"
          dotnet restore "$SLN_PATH"
          dotnet build "$SLN_PATH" --no-restore --configuration Release
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  review-check:
    name: Code Review Check
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify approved code review
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            const approved = reviews.some(r => r.state === 'APPROVED');
            if (!approved) {
              core.setFailed("Код-рев'ю не схвалено! Потрібен Approve від іншого учасника.");
            }
